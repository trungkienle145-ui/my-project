<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    /* ------ MÀU XANH NHẠT TUỲ CHỈNH ------ */
    :root {
        --bs-primary: #4da3ff !important;      /* màu xanh nhạt */
        --bs-primary-rgb: 77, 163, 255 !important;
    }

    /* Nút xanh nhạt */
    .btn-primary {
        background-color: var(--bs-primary) !important;
        border-color: var(--bs-primary) !important;
    }

    .btn-primary:hover {
        background-color: #1c8cff !important;
        border-color: #1c8cff !important;
    }

    /* Nút viền xanh nhạt */
    .btn-outline-primary {
        color: var(--bs-primary) !important;
        border-color: var(--bs-primary) !important;
    }

    .btn-outline-primary:hover {
        background-color: var(--bs-primary) !important;
        color: white !important;
    }

    /* Tiêu đề xanh nhạt */
    .text-primary {
        color: var(--bs-primary) !important;
    }

    /* Viền input khi focus → xanh nhạt */
    .form-control:focus {
        border-color: var(--bs-primary) !important;
        box-shadow: 0 0 0 0.15rem rgba(77, 163, 255, 0.35) !important;
    }
</style>

<div class="container mt-4">

    <!-- Nút điều hướng -->
    <div class="d-flex mb-3 gap-2">
        <a href="index.html" class="btn btn-primary">← Quay về Trang chủ</a>
        <a href="club-info.html" class="btn btn-outline-primary">Đi đến Trang CLB →</a>
    </div>

    <div class="card shadow p-4">
        <h3 class="text-primary fw-bold mb-4">Cập nhật thông tin Câu Lạc Bộ</h3>

        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Tên Câu Lạc Bộ</label>
                    <input type="text" class="form-control" placeholder="Nhập tên CLB">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Chủ nhiệm CLB</label>
                    <input type="text" class="form-control" placeholder="Nhập tên chủ nhiệm">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Số lượng thành viên</label>
                    <input type="number" class="form-control" placeholder="VD: 30">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Lĩnh vực hoạt động</label>
                    <input type="text" class="form-control" placeholder="VD: Công nghệ, thể thao...">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mô tả chi tiết</label>
                <textarea class="form-control" rows="4" placeholder="Mô tả về CLB..."></textarea>
            </div>

            <button class="btn btn-primary px-4 mt-2">Lưu thông tin</button>
        </form>
    </div>

</div>
