<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4">

    <!-- Điều hướng -->
    <div class="d-flex mb-3 gap-2">
        <a href="index.html" class="btn btn-primary">← Quay về Trang chủ</a>
        <a href="event-list.html" class="btn btn-outline-primary">Đi đến danh sách sự kiện →</a>
    </div>

    <div class="card shadow p-4">
        <h3 class="text-primary fw-bold mb-4">Quản lý sự kiện</h3>

        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Tên sự kiện</label>
                    <input type="text" class="form-control" placeholder="VD: Workshop AI 2025">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ngày tổ chức</label>
                    <input type="date" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Địa điểm</label>
                    <input type="text" class="form-control" placeholder="Phòng A201, hội trường...">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số lượng người tham gia tối đa</label>
                    <input type="number" class="form-control" placeholder="VD: 100">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mô tả sự kiện</label>
                <textarea class="form-control" rows="4" placeholder="Nhập mô tả chi tiết..."></textarea>
            </div>

            <button class="btn btn-primary px-4 mt-2">Tạo sự kiện</button>
        </form>
    </div>

</div>
