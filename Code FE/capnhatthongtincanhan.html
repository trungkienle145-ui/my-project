<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4">
    <!-- Nút điều hướng -->
    <div class="d-flex mb-3 gap-2">
        <a href="index.html" class="btn btn-primary">← Quay về Trang chủ</a>
        <a href="profile.html" class="btn btn-outline-primary">Đi đến Trang cá nhân →</a>
    </div>

    <div class="card shadow p-4">
        <h3 class="text-primary fw-bold mb-3">Cập nhật thông tin cá nhân</h3>

        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" placeholder="Nhập họ tên">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Mã sinh viên</label>
                    <input type="text" class="form-control" placeholder="VD: 102345">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="example@gmail.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" placeholder="Nhập số điện thoại">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Địa chỉ</label>
                <input type="text" class="form-control" placeholder="Nhập địa chỉ">
            </div>

            <button class="btn btn-primary px-4">Lưu thay đổi</button>
        </form>
    </div>
</div>
